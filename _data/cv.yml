- title: Research and Technical Skills
  type: nested_list
  contents:
    - title: AI Security, Privacy, and Data Protection
      items:
        - AI security and privacy for enterprise, cloud, developer, and collaboration environments
        - GenAI data leakage risk, shadow AI governance, and sensitive-data exposure analysis
        - Semantic detection of sensitive information across prompts, uploads, documents, browser activity, and developer workflows
        - Local-first privacy controls, policy enforcement, auditability, and data minimisation for AI-enabled systems
        - Security and governance requirements for safe adoption of GenAI tools in regulated and data-sensitive organisations
    - title: Privacy-Preserving Computation and Applied Cryptography
      items:
        - Secure multiparty computation, private aggregation, threshold protocols, and confidential data processing
        - Zero-knowledge proofs, selective disclosure mechanisms, and verifiable computation concepts
        - Homomorphic encryption, including Paillier-based encrypted computation for distributed data systems
        - Cryptographic protocol design for confidentiality, integrity, authentication, and trust
        - Privacy-preserving computation for AI, energy, fintech, infrastructure, and multi-party data-sharing systems
    - title: Distributed and Blockchain Systems
      items:
        - Secure distributed systems, decentralised architectures, and trust-aware coordination mechanisms
        - Blockchain security, consensus mechanisms, and permissioned and consortium blockchain systems
        - Cross-chain interoperability protocols, notary-based verification, asset transfer, and data exchange
        - Smart contract design, security analysis, and empirical evaluation of blockchain-based systems
        - Platforms and tooling: Hyperledger Fabric, Fabric-CA, chaincode, Ethereum, Solidity, and Hyperledger Caliper
    - title: IoT, Edge, and Resource-Constrained Systems
      items:
        - IoT-blockchain integration, sensor data anchoring, and secure edge gateways
        - Context-aware, mobile, embedded, and offline-first system architectures
        - Resource-constrained system design for intermittent connectivity, limited compute, and field deployment constraints
        - Mobile and device integration: Android SDK, BLE, GSM/GPRS, USSD, SMS, and sensor-driven data collection
    - title: Systems Engineering, DevOps, and Research Tooling
      items:
        - Programming languages: Go, Python, Solidity, Java, TypeScript, and JavaScript
        - Distributed backend development, APIs, microservices, gRPC, data-processing pipelines, and research prototypes
        - Containerisation and orchestration: Docker, Kubernetes, Helm, and cloud-hosted development environments
        - CI/CD and experimentation pipelines: GitHub Actions, Jenkins, reproducible evaluation, and benchmark automation
        - Cloud and infrastructure platforms: IBM Cloud, AWS IoT Core, Infura, and blockchain deployment environments

