- key: ai-native-data-protection
  slug: 1_project
  title: AI-native data protection for enterprise AI workflows
  description: Detection, redaction, and auditing architectures for sensitive data exposure across copilots, browsers, IDEs, RAG, and agentic AI workflows.
  img: assets/img/security_lock.jpg
  importance: 1
  category: systems
  related_publications: false
  github: null
  redirect: null
  status: Active
  period: Jan 2025-Present
  content: |
    Enterprise AI systems create new paths for sensitive-data exposure across prompts, uploads, developer tools, and agentic workflows. This work focuses on practical detection and policy enforcement that can run close to the user.

    Key areas include on-device NER and secret detection, local-first redaction and blocking, and threat modelling for prompt leakage, source-code exposure, and shadow AI.

- key: caeser
  slug: 2_project
  title: CAESER - Cybersecurity analysis for consumer energy resources
  description: Cybersecurity threat modelling and stakeholder-facing analysis for smart inverters, distributed energy resources, and grid-edge infrastructure.
  img: assets/img/cybersecurity.jpg
  importance: 2
  category: systems
  related_publications: true
  github: null
  redirect: null
  status: Completed
  period: 2024
  content: |
    CAESER examined how insecure consumer energy resources can affect utilities, regulators, and critical infrastructure. The project focused on threat taxonomies, attack surfaces, and practical guidance for energy-sector decision-makers.

    The work produced peer-reviewed research and technical reporting around smart inverters, grid-edge risk, and cyber-physical resilience.

- key: distributed-education-data-platform
  slug: 10_project
  title: Distributed education data platform
  description: School census and school information systems for resource-constrained environments, with field data collection, validation, and reporting workflows.
  img: assets/img/analytics.jpg
  importance: 3
  category: systems
  related_publications: true
  github: null
  redirect: null
  status: Completed
  period: 2016-2017
  content: |
    This work combined data collection, validation, and analytics for large-scale education datasets in low-connectivity environments. It supported school profiling and reporting for public-sector decision-making.

    Outputs from this stream informed the School Census Hub and School Information Hub publications.

- key: cooperative-mobile-content-distribution
  slug: 11_project
  title: Cooperative mobile content distribution system
  description: Resource-aware cooperative downloading for low-end mobile devices operating under bandwidth, battery, and storage constraints.
  img: assets/img/education_ai.jpg
  importance: 4
  category: systems
  related_publications: true
  github: null
  redirect: null
  status: Completed
  period: 2015-2016
  patent: US9961139B2
  content: |
    The system coordinated segmented downloading across nearby devices to improve reliability and efficiency in constrained environments. Scheduling logic accounted for battery levels, storage, bandwidth, and device reliability.

    The work led to an ACM MOBILESoft paper and a granted US patent.

- key: farm-cultivation-quality-analytics
  slug: 12_project
  title: Farm cultivation quality analytics
  description: Knowledge-graph and machine-learning support for cultivation-quality assessment and evidence-based agricultural decision-making.
  img: assets/img/agriculture.jpg
  importance: 5
  category: systems
  related_publications: false
  github: null
  redirect: null
  status: Completed
  period: 2017-2018
  patent: US11497156B2
  content: |
    This work contributed to an agricultural analytics system that modelled farms, crops, and cultivation quality as structured data for downstream decision support.

    The result was formalised as a granted US patent.

- key: energipay
  slug: 3_project
  title: EnergiPay - Off-chain payment channels for peer-to-peer energy trading
  description: An off-chain payment-channel framework for blockchain-enabled peer-to-peer energy trading and lower-overhead settlement.
  img: assets/img/interoperability.jpg
  importance: 1
  category: frameworks
  related_publications: true
  github: null
  redirect: null
  status: Completed
  period: 2023-2024
  content: |
    EnergiPay models payment-channel settlement for future energy-credit tokens to reduce on-chain overhead and counterparty risk in peer-to-peer energy markets.

    The work was published at ACM e-Energy 2024.

- key: cypherchain
  slug: 4_project
  title: CypherChain - Privacy-preserving data aggregation for demand response
  description: Privacy-preserving aggregation for blockchain-based demand response using secure multiparty computation and homomorphic encryption.
  img: assets/img/privacy_crypto.jpg
  importance: 2
  category: frameworks
  related_publications: true
  github: null
  redirect: null
  status: Completed
  period: 2022-2024
  content: |
    CypherChain combines secure multiparty computation and homomorphic encryption to support private aggregation and verifiable coordination in demand-response settings.

    The framework was evaluated using smart-building energy data and published at IEEE ICBC 2024.

- key: plexichain
  slug: 5_project
  title: PlexiChain - Secure blockchain-based flexibility aggregation
  description: A secure flexibility-aggregation framework for distributed energy resources under adversarial grid conditions.
  img: assets/img/security_lock.jpg
  importance: 3
  category: frameworks
  related_publications: true
  github: null
  redirect: null
  status: Completed
  period: 2022
  content: |
    PlexiChain explored secure flexibility aggregation for distributed energy resources, including resilience against false data injection and coordinated demand manipulation.

    The work was released as an arXiv preprint.

- key: bailif
  slug: 6_project
  title: BAILIF - Blockchain-agnostic interoperability framework
  description: Cross-chain interoperability using decentralised notaries, attestation, and proof-of-concept exchange across blockchain networks.
  img: assets/img/interoperability.jpg
  importance: 4
  category: frameworks
  related_publications: true
  github: null
  redirect: null
  status: Completed
  period: 2021-2023
  content: |
    BAILIF addresses interoperability across heterogeneous blockchain networks without requiring consensus synchronisation. It focuses on attestation, notary-based verification, and practical cross-system exchange.

    The proof of concept was published at IEEE ICBC 2023.

- key: temporary-immutability
  slug: 7_project
  title: Temporary Immutability for prosumer-side energy trading
  description: A removable blockchain architecture that preserves auditability while allowing governed record removal in prosumer energy trading.
  img: assets/img/privacy_crypto.jpg
  importance: 5
  category: frameworks
  related_publications: true
  github: null
  redirect: null
  status: Completed
  period: 2020-2021
  content: |
    This work explored how prosumer-side energy trading systems can reduce storage overhead while still preserving accountability and governance.

    The resulting architecture was published in Journal of Network and Computer Applications.

- key: harb
  slug: 8_project
  title: HARB - Hypergraph-based adaptive consortium blockchain
  description: A hypergraph-based consortium blockchain for scalable decentralised energy trading and adaptive coordination.
  img: assets/img/harb_blockchain.jpg
  importance: 6
  category: frameworks
  related_publications: true
  github: null
  redirect: null
  status: Completed
  period: 2019-2020
  content: |
    HARB used hypergraph-based representations to support scalable coordination, clustering, and transaction routing in decentralised energy systems.

    The framework was published in IEEE Internet of Things Journal.

- key: relational-network-framework
  slug: 9_project
